name: Split

# Publish each packages/* directory to its own read-only repository, so
# consumers keep installing hydrakit/core and friends from Packagist while
# all development happens here. Nothing is ever pushed to those repos by
# hand: they are generated, and a direct push there will be overwritten.

on:
  push:
    branches: [main]
    tags: ['v*']
  # Re-run a split without a commit, after a token rotation or a failed job.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  split:
    name: '${{ matrix.package }}'
    runs-on: ubuntu-latest
    env:
      # A PAT with `repo` scope on hydra-foundation/*. The default GITHUB_TOKEN
      # is scoped to this repository and cannot push to the package repos.
      # Mapped here because the secrets context is not available to a step `if`.
      SPLIT_TOKEN: '${{ secrets.SPLIT_TOKEN }}'
    strategy:
      fail-fast: false
      matrix:
        package:
          - admin
          - auth
          - authorization
          - console
          - core
          - csrf
          - database
          - event
          - http
          - kernel
          - log
          - nyholm
          - php-di
          - session
          - validation
          - view

    steps:
      - uses: actions/checkout@v4
        if: ${{ env.SPLIT_TOKEN != '' }}
        with:
          fetch-depth: 0

      # Skips cleanly until the token exists, rather than failing sixteen jobs.
      - name: Split and push
        if: ${{ env.SPLIT_TOKEN != '' }}
        run: |
          set -euo pipefail
          pkg='${{ matrix.package }}'
          target="https://x-access-token:${SPLIT_TOKEN}@github.com/hydra-foundation/$pkg.git"

          # The import grafted each package's original commits, so the split
          # reuses their SHAs and the published history is the real one.
          sha=$(git subtree split --prefix="packages/$pkg")
          echo "$pkg split at $sha"

          # Forced because these repositories are generated: they always match
          # the monorepo, and anything pushed directly to one is overwritten
          # by design. The monorepo holds the history, so this is recoverable.
          git push --force "$target" "$sha:refs/heads/main"

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git push "$target" "$sha:refs/tags/$GITHUB_REF_NAME"
          fi

      # A push that lands but publishes the wrong content must not pass.
      - name: Verify the published tree
        if: ${{ env.SPLIT_TOKEN != '' }}
        run: |
          set -euo pipefail
          pkg='${{ matrix.package }}'
          expected=$(git rev-parse "HEAD:packages/$pkg")

          git clone --quiet --depth 1 \
            "https://x-access-token:${SPLIT_TOKEN}@github.com/hydra-foundation/$pkg.git" \
            /tmp/published
          published=$(git -C /tmp/published rev-parse 'HEAD^{tree}')

          if [ "$published" != "$expected" ]; then
            echo "::error::$pkg was not published: tree $published, expected $expected"
            exit 1
          fi
          echo "$pkg published at tree $expected"
